<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KPIs de Pauta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* ============================================================
   KPIs de Pauta — panel de control de costo publicitario
   Layout: encabezado fijo con controles de moneda/mes · nav de
   secciones · área central (máx 1120px) con medianiles de 16px.
   ============================================================ */
:root{
  /* Color — tokens (valores claros) */
  --bg:#f4f6f9;
  --surface:#ffffff;
  --surface-2:#eef1f6;
  --surface-3:#e6eaf1;
  --border:#dde2ea;
  --border-strong:#c7cedb;
  --fg:#182031;
  --fg-soft:#3c4658;
  --muted:#69738699;
  --muted-solid:#697386;
  --accent:#3552d9;
  --accent-fg:#ffffff;
  --accent-weak:#e9edff;
  --accent-line:#c9d3ff;
  /* Semánticos (estado del % de pauta) — independientes del acento */
  --good:#2b8a3e;   --good-bg:#e5f5e9;   --good-line:#8ce0a4;
  --warn:#c67506;   --warn-bg:#fdf1dd;   --warn-line:#f5c877;
  --bad:#c92a2a;    --bad-bg:#fce8e8;    --bad-line:#f1a3a3;
  /* Tipografía */
  --font-display:'Sora','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono','SFMono-Regular',Menlo,monospace;
  /* Formas */
  --r-lg:16px; --r-md:11px; --r-sm:8px;
  --shadow:0 1px 2px rgba(20,30,55,.06),0 8px 24px -12px rgba(20,30,55,.14);
  --shadow-sm:0 1px 2px rgba(20,30,55,.06);
  --maxw:1120px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1017; --surface:#161b24; --surface-2:#1c2230; --surface-3:#232b3a;
    --border:#2a3242; --border-strong:#3a4458;
    --fg:#e8ebf2; --fg-soft:#c2c9d6; --muted:#8b95a880; --muted-solid:#8b95a8;
    --accent:#7d92ff; --accent-fg:#0d1017; --accent-weak:#1b2440; --accent-line:#2f3f74;
    --good:#5cc16e; --good-bg:#132a1b; --good-line:#2c6b3c;
    --warn:#f0a63a; --warn-bg:#2e2410; --warn-line:#7a5a1e;
    --bad:#ff6b6b;  --bad-bg:#2e1717;  --bad-line:#7a2f2f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1017; --surface:#161b24; --surface-2:#1c2230; --surface-3:#232b3a;
  --border:#2a3242; --border-strong:#3a4458;
  --fg:#e8ebf2; --fg-soft:#c2c9d6; --muted:#8b95a880; --muted-solid:#8b95a8;
  --accent:#7d92ff; --accent-fg:#0d1017; --accent-weak:#1b2440; --accent-line:#2f3f74;
  --good:#5cc16e; --good-bg:#132a1b; --good-line:#2c6b3c;
  --warn:#f0a63a; --warn-bg:#2e2410; --warn-line:#7a5a1e;
  --bad:#ff6b6b;  --bad-bg:#2e1717;  --bad-line:#7a2f2f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:var(--font-body); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; text-wrap:balance; letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums; font-family:var(--font-mono)}
button{font-family:inherit}
::selection{background:var(--accent-weak)}

/* ---------- Encabezado ---------- */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:saturate(1.2) blur(10px);
  border-bottom:1px solid var(--border);
}
.topbar-inner{
  max-width:var(--maxw); margin:0 auto; padding:10px 16px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:11px; margin-right:auto}
.brand-mark{
  width:34px; height:34px; border-radius:10px; flex:none;
  background:linear-gradient(145deg,var(--accent),#6a80ff);
  display:grid; place-items:center; color:#fff; box-shadow:var(--shadow-sm);
}
.brand-mark svg{width:19px; height:19px}
.brand h1{font-size:15.5px; font-weight:700; line-height:1.1}
.brand p{margin:1px 0 0; font-size:11.5px; color:var(--muted-solid); font-weight:500}
.controls{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.ctl{
  display:flex; align-items:center; gap:6px;
  background:var(--surface-2); border:1px solid var(--border);
  border-radius:var(--r-sm); padding:5px 8px; font-size:12.5px; color:var(--fg-soft);
}
.ctl label{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted-solid); font-weight:600}
.ctl select,.ctl input[type="month"]{
  border:none; background:transparent; color:var(--fg); font-family:inherit;
  font-size:12.5px; font-weight:600; padding:1px 2px; outline:none;
}
.icon-btn{
  width:34px; height:34px; border-radius:var(--r-sm); flex:none;
  border:1px solid var(--border); background:var(--surface-2); color:var(--fg-soft);
  cursor:pointer; display:grid; place-items:center;
}
.icon-btn:hover{background:var(--surface-3); color:var(--fg)}
.icon-btn svg{width:17px; height:17px}

/* ---------- Nav secciones ---------- */
.tabs{
  max-width:var(--maxw); margin:0 auto; padding:0 16px;
  display:flex; gap:4px; overflow-x:auto; scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  appearance:none; border:none; background:none; cursor:pointer;
  padding:12px 12px 11px; font-size:13px; font-weight:600; color:var(--muted-solid);
  border-bottom:2px solid transparent; white-space:nowrap; display:flex; align-items:center; gap:7px;
  font-family:var(--font-display);
}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--accent); border-bottom-color:var(--accent)}
.tab .cnt{
  font-size:11px; font-weight:600; color:var(--muted-solid);
  background:var(--surface-3); border-radius:20px; padding:1px 7px; font-family:var(--font-mono);
}
.tab[aria-selected="true"] .cnt{background:var(--accent-weak); color:var(--accent)}

/* ---------- Layout general ---------- */
main{max-width:var(--maxw); margin:0 auto; padding:20px 16px 64px}
.section{display:flex; flex-direction:column; gap:18px}
.section-head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap}
.section-head h2{font-size:20px; font-weight:700}
.section-head p{margin:3px 0 0; color:var(--muted-solid); font-size:13px; max-width:60ch}
.eyebrow{
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.09em;
  color:var(--accent); font-family:var(--font-display);
}

/* ---------- Botones ---------- */
.btn{
  appearance:none; cursor:pointer; font-weight:600; font-size:13px;
  border-radius:var(--r-sm); padding:8px 13px; display:inline-flex; align-items:center; gap:7px;
  border:1px solid var(--border-strong); background:var(--surface); color:var(--fg-soft);
  transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--surface-2); color:var(--fg)}
.btn svg{width:15px; height:15px}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-fg)}
.btn-primary:hover{background:var(--accent); filter:brightness(1.06); color:var(--accent-fg)}
.btn-ghost{border-color:transparent; background:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger:hover{color:var(--bad); border-color:var(--bad-line)}
.btn-sm{padding:6px 10px; font-size:12px}

/* ---------- Tarjetas ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow-sm)}
.card-pad{padding:16px 18px}

/* ---------- KPIs dashboard ---------- */
.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px}
.kpi{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
  padding:15px 16px; display:flex; flex-direction:column; gap:9px; box-shadow:var(--shadow-sm); position:relative; overflow:hidden;
}
.kpi .k-top{display:flex; align-items:center; justify-content:space-between; gap:8px}
.kpi .k-label{font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--muted-solid)}
.kpi .k-ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted-solid)}
.kpi .k-ico svg{width:15px;height:15px}
.kpi .k-value{font-family:var(--font-mono); font-weight:600; font-size:24px; letter-spacing:-.02em; line-height:1}
.kpi .k-sub{font-size:12px; color:var(--muted-solid); display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.kpi.k-hero{grid-column:span 1}
.kpi.k-hero.status-good{background:var(--good-bg); border-color:var(--good-line)}
.kpi.k-hero.status-warn{background:var(--warn-bg); border-color:var(--warn-line)}
.kpi.k-hero.status-bad{background:var(--bad-bg); border-color:var(--bad-line)}
.kpi.k-hero .k-value{font-size:34px}

/* Chip de estado (verde/amarillo/rojo) */
.chip{
  display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700;
  padding:2px 9px 2px 7px; border-radius:20px; font-family:var(--font-body); white-space:nowrap;
}
.chip .dot{width:8px; height:8px; border-radius:50%}
.chip.status-good{background:var(--good-bg); color:var(--good)} .chip.status-good .dot{background:var(--good)}
.chip.status-warn{background:var(--warn-bg); color:var(--warn)} .chip.status-warn .dot{background:var(--warn)}
.chip.status-bad{background:var(--bad-bg); color:var(--bad)} .chip.status-bad .dot{background:var(--bad)}
.chip.status-none{background:var(--surface-3); color:var(--muted-solid)} .chip.status-none .dot{background:var(--muted-solid)}

/* ---------- Bloques del dashboard ---------- */
.dash-cols{display:grid; grid-template-columns:1.5fr 1fr; gap:14px}
@media (max-width:820px){.dash-cols{grid-template-columns:1fr}}
.panel-title{font-size:13.5px; font-weight:600; font-family:var(--font-display); display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px}
.panel-title .hint{font-size:11.5px; color:var(--muted-solid); font-weight:500; font-family:var(--font-body)}

/* Barras plataforma */
.pf-row{display:flex; align-items:center; gap:10px; margin-bottom:13px}
.pf-row:last-child{margin-bottom:0}
.pf-ico{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center}
.pf-ico svg{width:17px;height:17px}
.pf-ico.tiktok{background:#111;color:#fff}
.pf-ico.meta{background:#0866ff;color:#fff}
.pf-ico.block{background:var(--surface-3);color:var(--muted-solid)}
.pf-main{flex:1; min-width:0}
.pf-main .pf-top{display:flex; justify-content:space-between; gap:8px; font-size:12.5px; margin-bottom:5px}
.pf-main .pf-top b{font-weight:600}
.pf-main .pf-val{font-family:var(--font-mono); font-weight:600}
.pf-bar{height:8px; border-radius:6px; background:var(--surface-3); overflow:hidden}
.pf-bar span{display:block; height:100%; border-radius:6px}

/* ---------- Chart diario ---------- */
.chart-wrap{width:100%; overflow-x:auto}
svg.chart{display:block; width:100%; height:auto; min-width:520px}
.chart text{font-family:var(--font-mono); fill:var(--muted-solid)}
.legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:11.5px; color:var(--fg-soft)}
.legend i{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:11px;height:11px;border-radius:3px;display:inline-block}

/* ---------- Productos (despachos / testeos) ---------- */
.prod{border:1px solid var(--border); border-radius:var(--r-md); background:var(--surface); box-shadow:var(--shadow-sm); overflow:hidden}
.prod + .prod{margin-top:12px}
.prod-head{display:flex; align-items:center; gap:12px; padding:12px 14px; cursor:pointer; user-select:none}
.prod-head:hover{background:var(--surface-2)}
.prod-caret{width:20px;height:20px;flex:none;color:var(--muted-solid);transition:transform .18s}
.prod[open] .prod-caret{transform:rotate(90deg)}
.prod-name{flex:1; min-width:0}
.prod-name input{
  font-family:var(--font-display); font-weight:600; font-size:14.5px; color:var(--fg);
  border:1px solid transparent; background:transparent; border-radius:6px; padding:3px 6px; width:100%;
  max-width:340px;
}
.prod-name input:hover{border-color:var(--border)}
.prod-name input:focus{border-color:var(--accent-line); background:var(--surface); outline:none}
.prod-stats{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.prod-stat{text-align:right}
.prod-stat .ps-label{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted-solid); font-weight:600}
.prod-stat .ps-val{font-family:var(--font-mono); font-weight:600; font-size:13.5px}
@media (max-width:640px){.prod-stat.hide-sm{display:none}}
.prod-body{border-top:1px solid var(--border); padding:4px 0 0}

/* Grid diario tipo hoja */
.sheet-wrap{overflow-x:auto}
table.sheet{border-collapse:collapse; width:100%; min-width:560px; font-size:13px}
table.sheet th,table.sheet td{padding:0; text-align:right}
table.sheet thead th{
  position:sticky; top:0; background:var(--surface-2); color:var(--muted-solid);
  font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; font-weight:600;
  padding:8px 12px; border-bottom:1px solid var(--border); text-align:right; z-index:1;
}
table.sheet thead th:first-child{text-align:left}
table.sheet tbody td{border-bottom:1px solid var(--border)}
table.sheet tbody tr:hover td{background:var(--surface-2)}
.day-cell{padding:7px 12px; text-align:left; font-family:var(--font-mono); font-size:12px; color:var(--fg-soft); white-space:nowrap}
.day-cell .dow{color:var(--muted-solid); font-size:10.5px; margin-left:4px}
.sheet input.cell{
  width:100%; border:none; background:transparent; text-align:right; padding:7px 12px;
  font-family:var(--font-mono); font-size:12.5px; color:var(--fg); outline:none;
  font-variant-numeric:tabular-nums;
}
.sheet input.cell:focus{background:var(--accent-weak); box-shadow:inset 0 0 0 1.5px var(--accent-line)}
.sheet input.cell::placeholder{color:var(--muted)}
.pct-cell{padding:7px 12px; font-family:var(--font-mono); font-weight:600; font-size:12.5px; white-space:nowrap}
.pct-cell .chip{font-size:11px}
table.sheet tfoot td{
  border-top:2px solid var(--border-strong); padding:9px 12px; font-family:var(--font-mono);
  font-weight:600; font-size:12.5px; background:var(--surface-2);
}
table.sheet tfoot td:first-child{text-align:left; font-family:var(--font-display); font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted-solid)}
.prod-actions{display:flex; justify-content:flex-end; padding:10px 14px}

/* ---------- Tabla bloqueos ---------- */
table.simple{border-collapse:collapse; width:100%; min-width:520px; font-size:13px}
table.simple th{
  text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--muted-solid); font-weight:600; padding:9px 12px; border-bottom:1px solid var(--border);
}
table.simple th.r,table.simple td.r{text-align:right}
table.simple td{padding:4px 12px; border-bottom:1px solid var(--border)}
table.simple input,table.simple select{
  width:100%; border:1px solid transparent; background:transparent; border-radius:6px;
  padding:6px 8px; font-family:inherit; font-size:13px; color:var(--fg); outline:none;
}
table.simple td.r input{text-align:right; font-family:var(--font-mono); font-variant-numeric:tabular-nums}
table.simple input:hover,table.simple select:hover{border-color:var(--border)}
table.simple input:focus,table.simple select:focus{border-color:var(--accent-line); background:var(--surface)}
table.simple tfoot td{font-family:var(--font-mono); font-weight:600; border-top:2px solid var(--border-strong); background:var(--surface-2); padding:9px 12px}
table.simple tfoot td:first-child{font-family:var(--font-display); text-transform:uppercase; font-size:11px; letter-spacing:.04em; color:var(--muted-solid)}
.row-del{width:30px;height:30px;border-radius:7px;border:1px solid transparent;background:none;cursor:pointer;color:var(--muted-solid);display:grid;place-items:center}
.row-del:hover{color:var(--bad); background:var(--bad-bg)}
.row-del svg{width:15px;height:15px}

/* ---------- Ajustes ---------- */
.set-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; align-items:start}
.field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px}
.field label{font-size:12px; font-weight:600; color:var(--fg-soft)}
.field .desc{font-size:11.5px; color:var(--muted-solid); margin-top:-2px}
.field input,.field select{
  border:1px solid var(--border-strong); background:var(--surface); color:var(--fg);
  border-radius:var(--r-sm); padding:8px 10px; font-family:inherit; font-size:13.5px; outline:none;
}
.field input:focus,.field select:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-weak)}
.cur-table{width:100%; border-collapse:collapse; font-size:13px; margin-top:8px}
.cur-table th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted-solid); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--border)}
.cur-table td{padding:3px 8px; border-bottom:1px solid var(--border)}
.cur-table input{width:100%; border:1px solid transparent; background:transparent; border-radius:6px; padding:6px 7px; font-family:inherit; font-size:13px; color:var(--fg); outline:none}
.cur-table input:hover{border-color:var(--border)} .cur-table input:focus{border-color:var(--accent-line); background:var(--surface)}
.cur-table td.r input{text-align:right; font-family:var(--font-mono)}
.badge-base{font-size:10px; font-weight:700; color:var(--accent); background:var(--accent-weak); padding:1px 6px; border-radius:5px; margin-left:6px; letter-spacing:.03em}
.thr-preview{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}

/* ---------- Tooltip chart ---------- */
#tt{
  position:fixed; z-index:80; pointer-events:none; opacity:0; transform:translate(-50%,-118%);
  background:var(--fg); color:var(--bg); font-size:11.5px; padding:6px 9px; border-radius:8px;
  box-shadow:var(--shadow); transition:opacity .1s; white-space:nowrap; font-family:var(--font-mono); font-weight:500;
}
#tt b{font-family:var(--font-body)}

/* ---------- Vacío ---------- */
.empty{text-align:center; padding:38px 20px; color:var(--muted-solid)}
.empty svg{width:34px;height:34px;opacity:.5;margin-bottom:10px}
.empty p{margin:0 0 14px; font-size:13.5px}

.footnote{font-size:11.5px; color:var(--muted-solid); text-align:center; margin-top:8px}
.example-tag{font-size:10px;font-weight:700;color:var(--warn);background:var(--warn-bg);padding:1px 6px;border-radius:5px;letter-spacing:.03em;text-transform:uppercase}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--accent); outline-offset:1px; border-radius:4px}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l3-4 4 3 4-7"/></svg>
      </div>
      <div>
        <h1>KPIs de Pauta</h1>
        <p>Costo publicitario vs. facturación</p>
      </div>
    </div>
    <div class="controls">
      <div class="ctl">
        <label for="monthPick">Mes</label>
        <input type="month" id="monthPick" value="2026-01">
      </div>
      <div class="ctl">
        <label for="curPick">Moneda</label>
        <select id="curPick"></select>
      </div>
      <button class="icon-btn" id="themeBtn" title="Cambiar tema" aria-label="Cambiar tema">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>

<main id="view"></main>

<div id="tt" role="status" aria-live="off"></div>

<script>
"use strict";
/* ============================================================
   Estado + persistencia
   Todo el dinero se guarda en la MONEDA BASE (COP por defecto).
   Al mostrar/editar se convierte a la moneda activa con su tasa.
   ============================================================ */
const LS_KEY = "kpis_pauta_v1";
const uid = () => Math.random().toString(36).slice(2,9);
const DOW = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];

function defaultState(){
  return {
    base:"COP",
    currency:"COP",
    currencies:{
      COP:{symbol:"$",  name:"Peso colombiano", rate:1,   decimals:0},
      GTQ:{symbol:"Q",  name:"Quetzal",         rate:520, decimals:2},
      USD:{symbol:"US$",name:"Dólar",           rate:4000,decimals:2},
    },
    thresholds:{green:19, yellow:20}, // pct<=green→verde · pct<=yellow→amarillo · resto→rojo
    theme:"system",
    activeMonth:"2026-01",
    months:{}
  };
}
function seedMonth(){
  // Datos de ejemplo (enero 2026) — bórralos con el botón en Ajustes.
  return {
    despacho:[
      {id:uid(), name:"Reloj inteligente", example:true, days:{
        1:{tiktok:50000,  facebook:30000, facturado:800000},
        2:{tiktok:120000, facebook:80000, facturado:900000},
        3:{tiktok:60000,  facebook:40000, facturado:1100000},
      }},
      {id:uid(), name:"Set de organizadores", example:true, days:{
        1:{tiktok:35000, facebook:0,     facturado:250000},
        2:{tiktok:45000, facebook:20000, facturado:300000},
      }},
    ],
    testeos:[
      {id:uid(), name:"Testeo · Audífonos TWS", example:true, days:{
        1:{tiktok:40000, facebook:0, facturado:0},
        2:{tiktok:38000, facebook:15000, facturado:120000},
      }},
    ],
    bloqueos:[
      {id:uid(), plataforma:"IP proxy", presupuesto:30000, inversion:30000, nota:"Cuenta bloqueada", example:true},
      {id:uid(), plataforma:"IP proxy", presupuesto:30000, inversion:0, nota:"Reemplazo", example:true},
    ]
  };
}
let state = load();
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const s = JSON.parse(raw); return migrate(s); }
  }catch(e){}
  const s = defaultState();
  s.months[s.activeMonth] = seedMonth();
  return s;
}
function migrate(s){
  const d = defaultState();
  s.base ||= d.base; s.currency ||= d.currency;
  s.currencies ||= d.currencies; s.thresholds ||= d.thresholds;
  s.theme ||= "system"; s.months ||= {};
  s.activeMonth ||= d.activeMonth;
  return s;
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

function monthData(){
  if(!state.months[state.activeMonth]) state.months[state.activeMonth] = {despacho:[],testeos:[],bloqueos:[]};
  const m = state.months[state.activeMonth];
  m.despacho ||= []; m.testeos ||= []; m.bloqueos ||= [];
  return m;
}
function daysInMonth(){
  const [y,mo] = state.activeMonth.split("-").map(Number);
  return new Date(y, mo, 0).getDate();
}
function dowFor(day){
  const [y,mo] = state.activeMonth.split("-").map(Number);
  return DOW[new Date(y, mo-1, day).getDay()];
}

/* ---------- Conversión + formato de dinero ---------- */
function cur(){ return state.currencies[state.currency]; }
function toActive(base){ return base / (cur().rate||1); }
function toBase(active){ return active * (cur().rate||1); }
function fmtMoney(base, withSymbol=true){
  const c = cur(); const v = toActive(base||0);
  const n = v.toLocaleString("es-CO",{minimumFractionDigits:c.decimals, maximumFractionDigits:c.decimals});
  return withSymbol ? `${c.symbol} ${n}` : n;
}
function fmtInput(base){
  // valor plano para el input editable (moneda activa), vacío si es 0
  if(!base) return "";
  const c = cur(); const v = toActive(base);
  return c.decimals ? String(Math.round(v*100)/100) : String(Math.round(v));
}
function parseInput(str){
  if(str==null) return 0;
  const clean = String(str).replace(/[^0-9.,-]/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",",".");
  const n = parseFloat(clean);
  return isNaN(n) ? 0 : Math.max(0, toBase(n));
}
function fmtPct(p){ return (p==null||!isFinite(p)) ? "—" : p.toFixed(1).replace(".",",")+"%"; }

/* ---------- Estado (verde/amarillo/rojo) ---------- */
function statusOf(pct){
  if(pct==null || !isFinite(pct)) return "none";
  if(pct <= state.thresholds.green) return "good";
  if(pct <= state.thresholds.yellow) return "warn";
  return "bad";
}
const STATUS_LABEL = {good:"Óptimo", warn:"Alerta", bad:"Crítico", none:"Sin datos"};

/* ---------- Cálculos ---------- */
function prodTotals(p){
  let tk=0, fb=0, fac=0;
  for(const k in (p.days||{})){
    const d = p.days[k]||{};
    tk += (+d.tiktok||0); fb += (+d.facebook||0); fac += (+d.facturado||0);
  }
  const spend = tk+fb;
  return {tiktok:tk, facebook:fb, spend, facturado:fac, pct: fac>0 ? spend/fac*100 : null};
}
function sectionTotals(list){
  let tk=0, fb=0, fac=0;
  list.forEach(p=>{ const t=prodTotals(p); tk+=t.tiktok; fb+=t.facebook; fac+=t.facturado; });
  const spend=tk+fb;
  return {tiktok:tk, facebook:fb, spend, facturado:fac, pct: fac>0? spend/fac*100 : null};
}
function bloqueoTotal(){
  return monthData().bloqueos.reduce((s,b)=>s+(+b.inversion||0),0);
}
function grandTotals(){
  const m = monthData();
  const d = sectionTotals(m.despacho);
  const t = sectionTotals(m.testeos);
  const blk = bloqueoTotal();
  const tiktok = d.tiktok + t.tiktok;
  const facebook = d.facebook + t.facebook;
  const spend = tiktok + facebook;           // gasto publicitario
  const inversion = spend + blk;             // inversión total (incluye bloqueos)
  const facturado = d.facturado + t.facturado;
  return {despacho:d, testeos:t, bloqueos:blk, tiktok, facebook, spend, inversion, facturado,
          pct: facturado>0 ? spend/facturado*100 : null};
}
// Serie diaria de % (gasto pauta / facturado por día, todas las secciones)
function dailySeries(){
  const m = monthData(); const N = daysInMonth(); const out=[];
  for(let day=1; day<=N; day++){
    let spend=0, fac=0;
    [...m.despacho, ...m.testeos].forEach(p=>{
      const d = (p.days||{})[day]; if(!d) return;
      spend += (+d.tiktok||0)+(+d.facebook||0); fac += (+d.facturado||0);
    });
    out.push({day, spend, fac, pct: fac>0? spend/fac*100 : null});
  }
  return out;
}

/* ============================================================
   Render
   ============================================================ */
const TABS = [
  {id:"resumen",  label:"Resumen"},
  {id:"despacho", label:"Despachos"},
  {id:"testeos",  label:"Testeos"},
  {id:"bloqueos", label:"Bloqueos"},
  {id:"ajustes",  label:"Ajustes"},
];
let activeTab = "resumen";
const el = id => document.getElementById(id);
const view = el("view");

function renderTabs(){
  const m = monthData();
  const counts = {despacho:m.despacho.length, testeos:m.testeos.length, bloqueos:m.bloqueos.length};
  el("tabs").innerHTML = TABS.map(t=>{
    const c = counts[t.id];
    return `<button class="tab" role="tab" data-tab="${t.id}" aria-selected="${t.id===activeTab}">
      ${t.label}${c!=null?`<span class="cnt">${c}</span>`:""}</button>`;
  }).join("");
}

function render(){
  renderTabs();
  if(activeTab==="resumen") renderResumen();
  else if(activeTab==="despacho") renderProducts("despacho");
  else if(activeTab==="testeos") renderProducts("testeos");
  else if(activeTab==="bloqueos") renderBloqueos();
  else if(activeTab==="ajustes") renderAjustes();
  view.scrollTop = 0;
}

/* ---------- Iconos ---------- */
const IC = {
  money:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
  cart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>',
  pct:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>',
  wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>',
  tiktok:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 3c.3 2.1 1.6 3.7 3.5 4v2.6c-1.3 0-2.6-.4-3.6-1.1v5.8a5.7 5.7 0 1 1-5.7-5.7c.3 0 .6 0 .9.1v2.7a3 3 0 1 0 2.1 2.9V3h2.8Z"/></svg>',
  meta:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.2 5C4.4 5 2.5 8 2.5 11.6c0 2.7 1.3 4.4 3.2 4.4 1.5 0 2.5-1 4-3.6l.9-1.7c.2.4.5.9.8 1.5l1 1.8c1.6 2.6 2.6 3.5 4.2 3.5 2 0 3.2-1.8 3.2-4.6C19.8 8.2 17.8 5 15 5c-1.5 0-2.7 1-4 3.2C9.9 6 8.7 5 7.2 5Zm.2 2.3c.8 0 1.6.8 2.6 2.5l-.8 1.4C8 13.6 7.5 14.1 6.8 14.1c-.8 0-1.3-.9-1.3-2.4 0-2.5 1-4.4 1.9-4.4Zm9.2 0c.9 0 1.9 1.8 1.9 4.3 0 1.6-.5 2.5-1.3 2.5-.7 0-1.2-.5-2.4-2.6l-.9-1.6c1-1.8 1.9-2.6 2.7-2.6Z"/></svg>',
  block:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="5.6" y1="5.6" x2="18.4" y2="18.4"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
  caret:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>',
};

function chip(status, text){
  return `<span class="chip status-${status}"><span class="dot"></span>${text}</span>`;
}

/* ============================================================
   Vista: Resumen (dashboard)
   ============================================================ */
function renderResumen(){
  const g = grandTotals();
  const st = statusOf(g.pct);
  const series = dailySeries();
  const c = cur();
  const monthLabel = new Date(state.activeMonth+"-01T00:00").toLocaleDateString("es-CO",{month:"long",year:"numeric"});

  view.innerHTML = `
  <div class="section">
    <div class="section-head">
      <div>
        <div class="eyebrow">Panel del mes</div>
        <h2 style="text-transform:capitalize">${monthLabel}</h2>
        <p>Porcentaje de pauta = gasto en TikTok + Meta dividido por lo facturado. Verde ≤ ${state.thresholds.green}% · Amarillo ≤ ${state.thresholds.yellow}% · Rojo > ${state.thresholds.yellow}%. Cifras en ${c.name} (${state.currency}).</p>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi k-hero status-${st}">
        <div class="k-top">
          <span class="k-label">% de pauta global</span>
          ${chip(st, STATUS_LABEL[st])}
        </div>
        <div class="k-value">${fmtPct(g.pct)}</div>
        <div class="k-sub">${fmtMoney(g.spend)} en pauta sobre ${fmtMoney(g.facturado)} facturado</div>
      </div>
      <div class="kpi">
        <div class="k-top"><span class="k-label">Inversión total</span><span class="k-ico">${IC.wallet}</span></div>
        <div class="k-value">${fmtMoney(g.inversion)}</div>
        <div class="k-sub">Pauta ${fmtMoney(g.spend)} + bloqueos ${fmtMoney(g.bloqueos)}</div>
      </div>
      <div class="kpi">
        <div class="k-top"><span class="k-label">Facturación</span><span class="k-ico">${IC.cart}</span></div>
        <div class="k-value">${fmtMoney(g.facturado)}</div>
        <div class="k-sub">Despachos ${fmtMoney(g.despacho.facturado)} · Testeos ${fmtMoney(g.testeos.facturado)}</div>
      </div>
      <div class="kpi">
        <div class="k-top"><span class="k-label">Gasto en pauta</span><span class="k-ico">${IC.money}</span></div>
        <div class="k-value">${fmtMoney(g.spend)}</div>
        <div class="k-sub">TikTok ${fmtMoney(g.tiktok)} · Meta ${fmtMoney(g.facebook)}</div>
      </div>
    </div>

    <div class="dash-cols">
      <div class="card card-pad">
        <div class="panel-title">% de pauta por día <span class="hint">${monthLabel}</span></div>
        ${chartDaily(series)}
      </div>
      <div class="card card-pad">
        <div class="panel-title">Inversión por plataforma</div>
        ${platformBars(g)}
      </div>
    </div>

    <div class="dash-cols">
      ${sectionSummaryCard("Productos que se despachan","Stock propio · dropshipping", g.despacho, IC.cart)}
      ${sectionSummaryCard("Testeos","Productos que no se despachan", g.testeos, IC.pct)}
    </div>

    <p class="footnote">Los datos se guardan en este navegador. Exporta una copia desde Ajustes.</p>
  </div>`;
}

function sectionSummaryCard(title, sub, t, icon){
  const st = statusOf(t.pct);
  return `<div class="card card-pad">
    <div class="panel-title">${title}<span class="hint">${sub}</span></div>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div style="flex:1;min-width:120px">
        <div class="num" style="font-size:26px;font-weight:600">${fmtPct(t.pct)}</div>
        <div style="margin-top:6px">${chip(st, STATUS_LABEL[st])}</div>
      </div>
      <div style="display:grid;gap:7px;font-size:12.5px;min-width:150px">
        <div style="display:flex;justify-content:space-between;gap:14px"><span style="color:var(--muted-solid)">Pauta</span><b class="num">${fmtMoney(t.spend)}</b></div>
        <div style="display:flex;justify-content:space-between;gap:14px"><span style="color:var(--muted-solid)">Facturado</span><b class="num">${fmtMoney(t.facturado)}</b></div>
        <div style="display:flex;justify-content:space-between;gap:14px"><span style="color:var(--muted-solid)">TikTok</span><b class="num">${fmtMoney(t.tiktok)}</b></div>
        <div style="display:flex;justify-content:space-between;gap:14px"><span style="color:var(--muted-solid)">Meta</span><b class="num">${fmtMoney(t.facebook)}</b></div>
      </div>
    </div>
  </div>`;
}

function platformBars(g){
  const rows = [
    {k:"tiktok", label:"TikTok Ads", val:g.tiktok, cls:"tiktok", ico:IC.tiktok, color:"#111"},
    {k:"meta",   label:"Meta Ads",   val:g.facebook, cls:"meta", ico:IC.meta, color:"#0866ff"},
    {k:"block",  label:"Perdido por bloqueo", val:g.bloqueos, cls:"block", ico:IC.block, color:"var(--muted-solid)"},
  ];
  const max = Math.max(1, ...rows.map(r=>r.val));
  const total = g.inversion || 1;
  return rows.map(r=>{
    const pctShare = (r.val/total*100);
    const w = Math.max(r.val>0?4:0, r.val/max*100);
    const barColor = r.cls==="tiktok" ? "linear-gradient(90deg,#25252f,#000)"
                   : r.cls==="meta" ? "linear-gradient(90deg,#0866ff,#3b82f6)"
                   : "var(--border-strong)";
    return `<div class="pf-row">
      <div class="pf-ico ${r.cls}">${r.ico}</div>
      <div class="pf-main">
        <div class="pf-top"><b>${r.label}</b><span class="pf-val">${fmtMoney(r.val)} <span style="color:var(--muted-solid);font-weight:500">· ${pctShare.toFixed(0)}%</span></span></div>
        <div class="pf-bar"><span style="width:${w}%;background:${barColor}"></span></div>
      </div>
    </div>`;
  }).join("");
}

/* ---------- Chart diario de % de pauta ---------- */
function chartDaily(series){
  const W=560, H=230, padL=38, padR=14, padT=14, padB=26;
  const N = series.length;
  const withData = series.filter(s=>s.pct!=null);
  const maxPct = Math.max(state.thresholds.yellow+8, 30, ...withData.map(s=>s.pct));
  const top = Math.ceil(maxPct/10)*10;
  const x = i => padL + (N<=1?0: i*(W-padL-padR)/(N-1));
  const y = p => padT + (1 - p/top)*(H-padT-padB);

  // zonas verde/amarillo/rojo de fondo
  const zoneG = state.thresholds.green, zoneY = state.thresholds.yellow;
  const bandRects = `
    <rect x="${padL}" y="${y(zoneG)}" width="${W-padL-padR}" height="${H-padB-y(zoneG)}" fill="var(--good)" opacity=".07"/>
    <rect x="${padL}" y="${y(zoneY)}" width="${W-padL-padR}" height="${y(zoneG)-y(zoneY)}" fill="var(--warn)" opacity=".09"/>
    <rect x="${padL}" y="${padT}" width="${W-padL-padR}" height="${y(zoneY)-padT}" fill="var(--bad)" opacity=".07"/>`;

  // ejes/grid
  let grid="", yLabels="";
  for(let v=0; v<=top; v+=Math.max(10, Math.round(top/4/10)*10)){
    grid += `<line x1="${padL}" y1="${y(v)}" x2="${W-padR}" y2="${y(v)}" stroke="var(--border)" stroke-width="1"/>`;
    yLabels += `<text x="${padL-7}" y="${y(v)+3.5}" text-anchor="end" font-size="9.5">${v}%</text>`;
  }
  // líneas umbral
  const thrLines = `
    <line x1="${padL}" y1="${y(zoneG)}" x2="${W-padR}" y2="${y(zoneG)}" stroke="var(--good)" stroke-width="1.3" stroke-dasharray="4 3" opacity=".8"/>
    <line x1="${padL}" y1="${y(zoneY)}" x2="${W-padR}" y2="${y(zoneY)}" stroke="var(--bad)" stroke-width="1.3" stroke-dasharray="4 3" opacity=".7"/>`;

  // etiquetas eje X (cada ~5 días)
  let xLabels="";
  const step = N>20?5:(N>10?2:1);
  for(let i=0;i<N;i+=step){
    xLabels += `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="9">${series[i].day}</text>`;
  }

  if(!withData.length){
    return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Sin datos de porcentaje">
      ${bandRects}${grid}${yLabels}${thrLines}${xLabels}
      <text x="${(W+padL)/2}" y="${H/2}" text-anchor="middle" font-size="12" fill="var(--muted-solid)">Registra ventas y gasto para ver la curva</text>
    </svg></div>${chartLegend()}`;
  }

  // path del área + línea (solo días con datos, conectando consecutivos)
  const pts = series.map((s,i)=> s.pct!=null ? {cx:x(i), cy:y(Math.min(s.pct,top)), ...s} : null);
  let linePath="", areaPath="", started=false, firstX=0, lastX=0, lastY=0;
  pts.forEach(p=>{
    if(!p) return;
    if(!started){ linePath=`M ${p.cx} ${p.cy}`; areaPath=`M ${p.cx} ${y(0)} L ${p.cx} ${p.cy}`; firstX=p.cx; started=true; }
    else { linePath+=` L ${p.cx} ${p.cy}`; areaPath+=` L ${p.cx} ${p.cy}`; }
    lastX=p.cx; lastY=p.cy;
  });
  areaPath += ` L ${lastX} ${y(0)} Z`;

  const dots = pts.filter(Boolean).map(p=>{
    const s = statusOf(p.pct);
    const col = s==="good"?"var(--good)":s==="warn"?"var(--warn)":"var(--bad)";
    return `<circle class="pt" cx="${p.cx}" cy="${p.cy}" r="4.5" fill="${col}" stroke="var(--surface)" stroke-width="2"
      data-day="${p.day}" data-pct="${p.pct.toFixed(1)}" data-spend="${p.spend}" data-fac="${p.fac}" style="cursor:pointer"/>`;
  }).join("");

  return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Porcentaje de pauta por día">
    ${bandRects}${grid}${yLabels}
    <path d="${areaPath}" fill="var(--accent)" opacity=".08"/>
    <path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${thrLines}${xLabels}${dots}
  </svg></div>${chartLegend()}`;
}
function chartLegend(){
  return `<div class="legend">

function productCard(kind, p, idx){
  const t = prodTotals(p);
  const st = statusOf(t.pct);
  const open = p._open ? "open" : "";
  return `<details class="prod" ${open} data-kind="${kind}" data-id="${p.id}">
    <summary class="prod-head">
      <span class="prod-caret">${IC.caret}</span>
      <div class="prod-name">
        <input type="text" value="${escapeHtml(p.name||"")}" placeholder="Nombre del producto" data-field="name" aria-label="Nombre del producto"
          onclick="event.stopPropagation()" ${p.example?`title="Ejemplo"`:""}>
      </div>
      <div class="prod-stats">
        ${p.example?`<span class="example-tag">Ejemplo</span>`:""}
        <div class="prod-stat hide-sm"><div class="ps-label">Pauta</div><div class="ps-val">${fmtMoney(t.spend)}</div></div>
        <div class="prod-stat hide-sm"><div class="ps-label">Facturado</div><div class="ps-val">${fmtMoney(t.facturado)}</div></div>
        <div class="prod-stat"><div class="ps-label">% pauta</div><div class="ps-val">${chip(st, fmtPct(t.pct))}</div></div>
      </div>
    </summary>
    <div class="prod-body">
      ${dailySheet(p)}
      <div class="prod-actions">
        <button class="btn btn-sm btn-danger" data-act="delProd" data-kind="${kind}" data-id="${p.id}">${IC.trash} Eliminar producto</button>
      </div>
    </div>
  </details>`;
}

function dailySheet(p){
  const N = daysInMonth();
  const t = prodTotals(p);
  let rows="";
  for(let day=1; day<=N; day++){
    const d = (p.days||{})[day] || {};
    const spend = (+d.tiktok||0)+(+d.facebook||0);
    const fac = (+d.facturado||0);
    const pct = fac>0 ? spend/fac*100 : null;
    const st = statusOf(pct);
    rows += `<tr data-day="${day}">
      <td class="day-cell">${day}<span class="dow">${dowFor(day)}</span></td>
      <td><input class="cell" inputmode="decimal" data-f="tiktok" data-id="${p.id}" data-day="${day}" value="${fmtInput(d.tiktok)}" placeholder="0"></td>
      <td><input class="cell" inputmode="decimal" data-f="facebook" data-id="${p.id}" data-day="${day}" value="${fmtInput(d.facebook)}" placeholder="0"></td>
      <td><input class="cell" inputmode="decimal" data-f="facturado" data-id="${p.id}" data-day="${day}" value="${fmtInput(d.facturado)}" placeholder="0"></td>
      <td class="pct-cell" data-pctcell="${day}">${pct==null?`<span style="color:var(--muted)">—</span>`:chip(st,fmtPct(pct))}</td>
    </tr>`;
  }
  return `<div class="sheet-wrap"><table class="sheet">
    <thead><tr>
      <th>Día</th><th>TikTok</th><th>Meta / FB</th><th>Facturado</th><th>% pauta</th>
    </tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr data-foot="${p.id}">
      <td>Total</td>
      <td data-foot-f="tiktok">${fmtMoney(t.tiktok)}</td>
      <td data-foot-f="facebook">${fmtMoney(t.facebook)}</td>
      <td data-foot-f="facturado">${fmtMoney(t.facturado)}</td>
      <td data-foot-f="pct">${chip(statusOf(t.pct), fmtPct(t.pct))}</td>
    </tr></tfoot>
  </table></div>`;
}

function enforceThresholds(){ if(state.thresholds.yellow < state.thresholds.green) state.thresholds.yellow = state.thresholds.green; }

/* ============================================================
   Acciones
   ============================================================ */
function addProduct(kind){
  monthData()[kind].push({id:uid(), name:"", days:{}, _open:true});
  save(); renderProducts(kind);
}
function addBloqueo(){
  monthData().bloqueos.push({id:uid(), plataforma:"", presupuesto:0, inversion:0, nota:""});
  save(); renderBloqueos();
}
function addCurrency(){
  let code = "MON"; let i=1;
  while(state.currencies[code]) code = "MON"+(i++);
  state.currencies[code] = {symbol:code[0], name:"Nueva moneda", rate:1, decimals:2};
  save(); renderAjustes(); rebuildCurPicker();
}
function clearExamples(){
  const m = monthData();
  m.despacho = m.despacho.filter(p=>!p.example);
  m.testeos = m.testeos.filter(p=>!p.example);
  m.bloqueos = m.bloqueos.filter(b=>!b.example);
  save(); render();
}
function resetMonth(){
  // window.confirm funciona al abrir el archivo en el navegador; en el visor de
  // artefactos devuelve false, así que ahí no se borra nada por accidente.
  let ok = true;
  try{ ok = window.confirm(`¿Vaciar todos los datos de ${state.activeMonth}? Esta acción no se puede deshacer.`); }catch(e){}
  if(!ok) return;
  state.months[state.activeMonth] = {despacho:[],testeos:[],bloqueos:[]};
  save(); render();
}

function exportData(){
  try{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `kpis-pauta-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }catch(e){ alert("No se pudo exportar en este entorno. Abre el archivo HTML directamente en tu navegador para descargar."); }
}
function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const s = JSON.parse(rd.result);
      if(!s.months) throw 0;
      state = migrate(s);
      if(!state.currencies[state.currency]) state.currency = state.base;
      save(); rebuildCurPicker();
      el("monthPick").value = state.activeMonth;
      render();
    }catch(err){ alert("Archivo no válido."); }
  };
  rd.readAsText(file);
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function clampNum(v,min){ const n=parseFloat(v); return isNaN(n)?min:Math.max(min,n); }

/* ============================================================
   Edición en vivo (delegación de eventos)
   ============================================================ */
// Celdas diarias de productos
view.addEventListener("input", e=>{
  const t = e.target;
  if(t.classList.contains("cell")){
    const {id, day, f} = t.dataset;
    const kind = t.closest(".prod").dataset.kind;
    const p = monthData()[kind].find(x=>x.id===id); if(!p) return;
    p.days[day] ||= {};
    p.days[day][f] = parseInput(t.value);
    updateSheetRow(p, +day, t.closest(".prod"));
    save();
  }
  else if(t.dataset.field==="name"){
    const prod = t.closest(".prod");
    const p = monthData()[prod.dataset.kind].find(x=>x.id===prod.dataset.id);
    if(p){ p.name = t.value; delete p.example; save(); }
  }
  else if(t.dataset.bf){
    const b = monthData().bloqueos.find(x=>x.id===t.dataset.id); if(!b) return;
    const f = t.dataset.bf;
    b[f] = (f==="presupuesto"||f==="inversion") ? parseInput(t.value) : t.value;
    delete b.example;
    if(f==="presupuesto"||f==="inversion") updateBloqueoTotals();
    save();
  }
  else if(t.dataset.cf){
    const c = state.currencies[t.dataset.code]; if(!c) return;
    const f = t.dataset.cf;
    if(f==="rate") c.rate = Math.max(0.000001, clampNum(t.value,0.000001));
    else if(f==="decimals") c.decimals = Math.min(4, Math.max(0, Math.round(clampNum(t.value,0))));
    else c[f] = t.value;
    save();
  }
});

// Actualiza fila + pie de una hoja sin re-render completo
function updateSheetRow(p, day, prodEl){
  const d = p.days[day]||{};
  const spend = (+d.tiktok||0)+(+d.facebook||0), fac=(+d.facturado||0);
  const pct = fac>0? spend/fac*100 : null;
  const cell = prodEl.querySelector(`[data-pctcell="${day}"]`);
  if(cell) cell.innerHTML = pct==null?`<span style="color:var(--muted)">—</span>`:chip(statusOf(pct), fmtPct(pct));
  // pie
  const t = prodTotals(p);
  const foot = prodEl.querySelector(`[data-foot="${p.id}"]`);
  if(foot){
    foot.querySelector('[data-foot-f="tiktok"]').textContent = fmtMoney(t.tiktok);
    foot.querySelector('[data-foot-f="facebook"]').textContent = fmtMoney(t.facebook);
    foot.querySelector('[data-foot-f="facturado"]').textContent = fmtMoney(t.facturado);
    foot.querySelector('[data-foot-f="pct"]').innerHTML = chip(statusOf(t.pct), fmtPct(t.pct));
  }
  // cabecera del producto
  const stats = prodEl.querySelector(".prod-stats");
  if(stats){
    const vals = stats.querySelectorAll(".ps-val");
    if(vals.length>=3){
      vals[0].textContent = fmtMoney(t.spend);
      vals[1].textContent = fmtMoney(t.facturado);
      vals[2].innerHTML = chip(statusOf(t.pct), fmtPct(t.pct));
    }
  }
}
function updateBloqueoTotals(){
  const list = monthData().bloqueos;
  const totPres = list.reduce((s,b)=>s+(+b.presupuesto||0),0);
  const totInv = list.reduce((s,b)=>s+(+b.inversion||0),0);
  const tf = view.querySelector("table.simple tfoot");
  if(tf){ const tds=tf.querySelectorAll("td"); tds[2].textContent=fmtMoney(totPres); tds[3].textContent=fmtMoney(totInv); }
}

// Clicks (eliminar producto/fila, guardar estado abierto)
view.addEventListener("click", e=>{
  const del = e.target.closest("[data-act='delProd']");
  if(del){
    const p = monthData()[del.dataset.kind];
    const i = p.findIndex(x=>x.id===del.dataset.id);
    if(i>=0){ p.splice(i,1); save(); renderProducts(del.dataset.kind); }
    return;
  }
  const delBlk = e.target.closest("[data-delblk]");
  if(delBlk){
    const list = monthData().bloqueos;
    const i = list.findIndex(x=>x.id===delBlk.dataset.delblk);
    if(i>=0){ list.splice(i,1); save(); renderBloqueos(); }
  }
});
// Guardar estado abierto/cerrado de cada producto
view.addEventListener("toggle", e=>{
  const prod = e.target.closest(".prod");
  if(prod && e.target.tagName==="DETAILS"){
    const p = monthData()[prod.dataset.kind]?.find(x=>x.id===prod.dataset.id);
    if(p) p._open = e.target.open;
  }
}, true);

/* ---------- Tooltip del chart ---------- */
const tt = el("tt");
view.addEventListener("mouseover", e=>{

  const day = pt.dataset.day, pct = pt.dataset.pct.replace(".",",");

view.addEventListener("mousemove", e=>{

});
view.addEventListener("mouseout", e=>{ if(e.target.closest(".pt")) tt.style.opacity="0"; });

// Tema
function applyTheme(){
  if(state.theme==="system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", state.theme);
}
el("themeBtn").addEventListener("click", ()=>{
  const order = ["system","light","dark"];
  const cur = order.indexOf(state.theme);
  state.theme = order[(cur+1)%order.length];
  applyTheme(); save();
});

/* ---------- Init ---------- */
function boot(){
  applyTheme();
  el("monthPick").value = state.activeMonth;
  if(!state.currencies[state.currency]) state.currency = state.base;
  rebuildCurPicker();
  render();
}
boot();
</script>
</body>
</html>
